# CI runs on our self-hosted Gitea (act-runner). GitHub Actions are not used for this template.
name: ci
on:
  push:
  pull_request:

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - run: tofu fmt -check -recursive infra
      - name: validate org
        working-directory: infra/org
        run: tofu init -backend=false -input=false && tofu validate
      - name: validate tenant template (covers the tenant and account-baseline modules)
        working-directory: infra/tenants/_template
        run: tofu init -backend=false -input=false && tofu validate

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: block committed .env files and key material
        run: |
          if git ls-files | grep -E '(^|/)\.env$' | grep -v -E '^(go|java|node)/\.env$'; then echo "tracked .env file"; exit 1; fi
          if git grep -nE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!infra'; then echo "key material found"; exit 1; fi
